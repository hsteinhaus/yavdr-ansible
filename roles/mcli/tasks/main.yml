---
# file: roles/mcli/tasks/main.yml


- name: apt | install vdr-plugin-mcli
  apt:
    name: vdr-plugin-mcli
    state: present
    install_recommends: no

- name: apt | install vdr-addon-mcli-tool
  apt:
    name: vdr-addon-mcli-tool
    state: present
    install_recommends: no
- name: expand template for /etc/vdr/conf.avail/mcli.conf
  template:
    src: templates/mcli.conf.j2
    dest: /etc/vdr/conf.avail/mcli.conf
  tags:
    - config
